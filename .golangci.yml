version: "2"

linters:
  enable:
    - errorlint
    - gocyclo
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Status lines to the terminal: a failed write there has nowhere
      # better to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 25
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: unreachable-code
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, unparam]

formatters:
  enable:
    - gofmt
