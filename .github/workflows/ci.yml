name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: fmt · vet · tidy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 75.0) { print "coverage below 75% floor"; exit 1 } }'

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          # Built with the Go version of go.mod: a binary built with an
          # older Go refuses to lint a newer module.
          install-mode: goinstall

  build:
    name: build (${{ matrix.os }})
    needs: checks
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o specforge${{ runner.os == 'Windows' && '.exe' || '' }} .
      # What depends on the platform: copies (copy-on-write on APFS,
      # junctions on Windows) and the guard's shell parsing.
      - run: go test ./internal/adapters/scratch/ ./internal/domain/guard/ ./internal/app/guardhook/
      - run: ./specforge${{ runner.os == 'Windows' && '.exe' || '' }} version
        shell: bash
