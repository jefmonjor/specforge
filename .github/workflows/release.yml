name: Release

# Publishing a version is pushing its tag:
#   git tag -a v5.0.0 -m "SpecForge 5.0.0" && git push origin v5.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog and the version come from the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before publishing
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
