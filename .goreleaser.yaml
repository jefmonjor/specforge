version: 2
project_name: specforge

builds:
  - main: .
    binary: specforge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/jefmonjor/specforge/v6/internal/buildinfo.Version={{.Version}}
      - -X github.com/jefmonjor/specforge/v6/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/jefmonjor/specforge/v6/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  name_template: "{{ .Tag }} — SpecForge"
  header: |
    Download the binary for your platform below, check it, and put it on your `PATH`:

    ```bash
    R=https://github.com/jefmonjor/specforge/releases/download/{{ .Tag }}
    F=specforge-darwin-arm64   # or darwin-amd64, linux-amd64, linux-arm64
    curl -LO $R/$F && curl -LO $R/checksums.txt
    sha256sum -c checksums.txt --ignore-missing   # macOS: shasum -a 256 -c …
    chmod +x $F && sudo mv $F /usr/local/bin/specforge
    specforge version
    ```

    On Windows, download `specforge-windows-amd64.exe`, rename it to `specforge.exe` and put it in a folder on your `PATH`. Then follow the [quickstart](https://github.com/jefmonjor/specforge#-quickstart) and the [user guide](https://github.com/jefmonjor/specforge/blob/{{ .Tag }}/USER_GUIDE.md).
