version: 2
project_name: specforge

builds:
  - main: .
    binary: specforge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X specforge/internal/buildinfo.Version={{.Version}}
      - -X specforge/internal/buildinfo.Commit={{.ShortCommit}}
      - -X specforge/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
