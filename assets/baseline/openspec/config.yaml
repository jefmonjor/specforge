schema: spec-driven

# Contexto de proyecto (SDDFramework) — se muestra a la IA al crear artefactos.
# Plantado por 'sdd.ps1' (motor OpenSpec). {{ARCH}} se sustituye al crear el proyecto.
context: |
  IDIOMA: responde y redacta SIEMPRE en español (España).
  Gobierno: cumple la constitución en .specify/memory/constitution.md y los estándares en
  .specify/standards/ (en especial java.md). Servicios Java = Spring Boot 3.5 / Java 21,
  empaquetado WAR sobre Tomcat EXTERNO (spring-boot-starter-tomcat scope=provided), artefactos
  desde el Nexus corporativo, despliegue en OCP4 (app.yaml). Arquitectura elegida: {{ARCH}}
  (mvc = capas simples; hexagonal = dominio + puertos/adaptadores).
  Calidad (gate): Checkstyle google_checks, cobertura JaCoCo >= 70 %, 0 BLOCKER/CRITICAL en Sonar.
  Regla de oro: NO inventes. Si falta contexto de negocio, márcalo como duda ([NEEDS CLARIFICATION]),
  no lo supongas.

# Reglas por artefacto.
rules:
  proposal:
    - Redacta en español (España).
    - Incluye "Por qué" (motivación de negocio) y criterios de aceptación.
  tasks:
    - Tareas pequeñas y verificables; cada una debe poder compilar y pasar tests.
    - El resultado tiene que superar 'mvn clean verify' (compila + JUnit + JaCoCo + Checkstyle).
